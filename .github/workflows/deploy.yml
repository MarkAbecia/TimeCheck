name: deploy
# staging: on push to main. production: on a v* tag (requires the `production` environment approval).
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions: { contents: read }
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    defaults: { run: { working-directory: database } }
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase db push --db-url "$SUPABASE_DB_URL"
        env: { SUPABASE_DB_URL: "${{ secrets.SUPABASE_DB_URL }}" }

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    steps:
      - name: Trigger Render deploys
        run: |
          for hook in "$WEB_HOOK" "$API_HOOK" "$WORKER_HOOK"; do curl -fsS -X POST "$hook"; done
        env:
          WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          WORKER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    timeout-minutes: 30
    defaults: { run: { working-directory: frontend } }
    env:
      SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for this commit to be live
        # Deploy hooks return at once; the web health check reports the deployed commit (RENDER_GIT_COMMIT).
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS "$SMOKE_BASE_URL/api/health" | jq -r .version || true)
            [ "$live" = "$GITHUB_SHA" ] && exit 0
            sleep 20
          done
          echo "Still serving ${live:-nothing} after 20 minutes, expected $GITHUB_SHA" >&2; exit 1
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
        env:
          SMOKE_LEADER_EMAIL: ${{ secrets.SMOKE_LEADER_EMAIL }}
          SMOKE_LEADER_PASSWORD: ${{ secrets.SMOKE_LEADER_PASSWORD }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_ADMIN_TOTP_SECRET: ${{ secrets.SMOKE_ADMIN_TOTP_SECRET }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: smoke-traces, path: frontend/test-results/smoke, retention-days: 7 }
